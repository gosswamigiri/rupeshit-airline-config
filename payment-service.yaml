server:
  port: 5009

spring:
  datasource:
    url: ${PAYMENT_DB_URL:}
    username: ${PAYMENT_DB_USERNAME:}
    password: ${PAYMENT_DB_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}

razorpay:
  api:
    key: ${RAZORPAY_KEY_ID:}
    secret: ${RAZORPAY_KEY_SECRET:}
  callback:
    base-url: http://localhost:5173
