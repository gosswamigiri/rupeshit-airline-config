server:
  port: 5006

spring:
  datasource:
    url: ${SEAT_DB_URL:}
    username: ${SEAT_DB_USERNAME:}
    password: ${SEAT_DB_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    consumer:
      group-id: ${SEAT_SERVICE_KAFKA_CONSUMER_GROUP_ID:}
      auto-offset-reset: earliest

